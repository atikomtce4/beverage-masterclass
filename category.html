<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>หมวดหมู่ | Beverage Masterclass</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile-style.css">
  <style>
    /* ===== Language Toggle (ขนาดเล็ก กะทัดรัด ชิดขวา) ===== */
    .lang-toggle {
      display: flex;
      background: #f5f5f5;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #4CAF50;
      flex-shrink: 0;
    }
    .lang-btn {
      padding: 4px 10px;
      border: none;
      background: transparent;
      color: #757575;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .lang-btn.active {
      background: #4CAF50;
      color: white;
    }
    .lang-btn:hover:not(.active) {
      background: #e8f5e9;
    }

    /* ===== ส่วนที่เหลือคงเดิมตามต้นฉบับ ===== */
    .hero-banner {
      background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
      border-radius: 16px; padding: 24px 20px; margin-bottom: 24px;
      color: white;
    }
    .hero-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .hero-desc { font-size: 14px; opacity: 0.9; line-height: 1.5; }
    
    .recipe-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .recipe-card {
      background: white; border-radius: 12px; overflow: hidden;
      border: 1px solid #f0f0f0; text-decoration: none; color: inherit;
      transition: transform 0.2s;
    }
    .recipe-card:active { transform: scale(0.98); }
    .recipe-card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
    .recipe-card-body { padding: 12px; }
    .recipe-card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #212121; line-height: 1.3; }
    .recipe-card-meta { display: flex; gap: 8px; margin-bottom: 8px; font-size: 11px; color: #757575; }
    .recipe-card-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .badge {
      background: #E8F5E9; color: #2E7D32; padding: 3px 8px;
      border-radius: 10px; font-size: 10px; font-weight: 600;
    }
    .empty-state { text-align: center; padding: 40px 20px; color: #757575; }
    .btn-back-category {
      display: block; width: 100%; padding: 14px; margin-top: 24px;
      background: white; color: #4CAF50; border: 2px solid #4CAF50;
      border-radius: 8px; font-family: inherit; font-size: 14px;
      font-weight: 600; text-align: center; text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="mobile-header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <h1 class="logo" id="headerTitle">หมวดหมู่</h1>
    
    <!-- ✅ แทนที่ div ว่าง ด้วยปุ่ม TH/EN ขนาดกะทัดรัด -->
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="th" onclick="switchLanguage('th')">TH</button>
      <button class="lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
    </div>
  </header>

  <main class="mobile-content">
    <div id="errorContainer" style="display: none; text-align: center; padding: 40px 20px;">
      <div style="font-size: 48px; margin-bottom: 16px;">😕</div>
      <h2 id="errorTitle">ไม่พบหมวดหมู่</h2>
      <p style="color: #757575; margin-bottom: 20px;" id="errorMsg">หมวดหมู่นี้อาจยังไม่มีข้อมูล</p>
      <a href="categories.html" class="btn-back-category">กลับไปหน้าหมวดหมู่</a>
    </div>

    <div id="categoryContainer" style="display: none;">
      <div class="hero-banner">
        <h1 class="hero-title" id="heroTitle">ชื่อหมวดหมู่</h1>
        <p class="hero-desc" id="heroDesc">คำอธิบายหมวดหมู่</p>
      </div>
      
      <div class="recipe-grid" id="recipeGrid">
        <!-- JS จะ Render ตรงนี้ -->
      </div>
      
      <a href="categories.html" class="btn-back-category" id="btnBackToCategories">← กลับไปหน้าหมวดหมู่</a>
    </div>
  </main>

  <footer class="mobile-footer">
    <p>© 2026 Beverage Masterclass</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
